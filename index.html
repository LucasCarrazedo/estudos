<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema de Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- TELA 1: LOGIN -->
  <main class="tela-login">
    <form id="formLogin" class="caixa-login" novalidate>
      <h1>Estoque</h1>
      <p>Entre com seu usuário para continuar</p>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com">
        <span class="erro" id="erroEmail"></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha">
        <span class="erro" id="erroSenha"></span>
      </div>

      <span class="erro" id="erroLogin"></span>
      <button type="submit" class="btn">Entrar</button>

      <p class="dica">Teste: admin@estoque.com / 123456</p>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
