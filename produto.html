<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | Sistema de Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- TELA 3: CADASTRO / EDIÇÃO -->
  <header class="topo">
    <strong>Sistema de Estoque</strong>
    <a href="painel.html">Voltar ao painel</a>
  </header>

  <main class="conteudo">
    <h2 id="titulo">Novo produto</h2>
    <br>

    <form id="formProduto" class="formulario" novalidate>
      <div id="mensagem" class="mensagem"></div>

      <div class="campo">
        <label for="nome">Nome do produto *</label>
        <input type="text" id="nome" maxlength="100">
        <span class="erro" id="erroNome"></span>
      </div>

      <div class="campo">
        <label for="categoria">Categoria *</label>
        <select id="categoria">
          <option value="">Selecione...</option>
        </select>
        <span class="erro" id="erroCategoria"></span>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="quantidade">Quantidade *</label>
          <input type="number" id="quantidade" min="0">
          <span class="erro" id="erroQuantidade"></span>
        </div>
        <div class="campo">
          <label for="minimo">Estoque mínimo *</label>
          <input type="number" id="minimo" min="0" value="5">
          <span class="erro" id="erroMinimo"></span>
        </div>
      </div>

      <div class="campo">
        <label for="preco">Preço (R$) *</label>
        <input type="number" id="preco" min="0" step="0.01">
        <span class="erro" id="erroPreco"></span>
      </div>

      <div class="botoes">
        <button type="submit" class="btn">Salvar</button>
        <a href="painel.html" class="btn btn-secundario">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
